services:
  api:
    build: .
    environment:
      CANCERJEV_SNAPSHOT_ROOT: /data/snapshots
      CANCERJEV_DATABASE_URL: postgresql+psycopg://cancerjev:cancerjev-local@postgres/cancerjev
      CANCERJEV_S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - snapshot-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest-worker:
    build: .
    command: ["python", "-m", "workers.ingest"]
    environment:
      CANCERJEV_SNAPSHOT_ROOT: /data/snapshots
      CANCERJEV_DATABASE_URL: postgresql+psycopg://cancerjev:cancerjev-local@postgres/cancerjev
    volumes: ["snapshot-data:/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}

  statistics-worker:
    build: .
    command: ["python", "-m", "workers.statistics"]
    environment:
      CANCERJEV_DATABASE_URL: postgresql+psycopg://cancerjev:cancerjev-local@postgres/cancerjev
    depends_on:
      migrate: {condition: service_completed_successfully}

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  web:
    build: apps/web
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cancerjev
      POSTGRES_USER: cancerjev
      POSTGRES_PASSWORD: cancerjev-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cancerjev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: cancerjev
      MINIO_ROOT_PASSWORD: cancerjev-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 cancerjev cancerjev-local-secret && mc mb --ignore-existing local/cancerjev"]
    depends_on:
      minio: {condition: service_healthy}

volumes:
  snapshot-data:
  postgres-data:
  object-data:
